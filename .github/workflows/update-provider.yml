name: Update verified streams

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/update-provider.yml'

permissions:
  contents: write

concurrency:
  group: provider-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test provider logic
        run: npm test
      - name: Validate streams and build provider
        run: npm run build
      - name: Enrich station logos and metadata
        run: node scripts/enrich-logos.mjs
      - name: Commit refreshed provider data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/stations.json dist/status.json
          if git diff --cached --quiet; then
            echo "Provider data unchanged"
            exit 0
          fi
          git commit -m "chore: refresh verified radio streams"
          git pull --rebase origin master
          git push origin master
